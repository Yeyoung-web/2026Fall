services:
  receiptory:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - receiptory-data:/data
    restart: unless-stopped
volumes:
  receiptory-data:
